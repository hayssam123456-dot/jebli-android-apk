name: Build Jebli APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and Customize Native Android Project
        run: |
          curl -sSL "https://jeblidelivery.netlify.app/downloads/jebli-android-project.zip" -o project.zip
          unzip -oq project.zip
          mkdir -p app/src/main/res/drawable
          cp app/src/main/res/ic_launcher-playstore.png app/src/main/res/drawable/splash_logo.png
          printf '<?xml version="1.0" encoding="utf-8"?>\n<inset xmlns:android="http://schemas.android.com/apk/res/android"\n    android:drawable="@drawable/splash_logo"\n    android:inset="16%%" />\n' > app/src/main/res/drawable/splash_icon_inset.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Jebli Delivery</string>\n</resources>\n' > app/src/main/res/values/strings.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="Theme.JebliApp" parent="Theme.AppCompat.Light.NoActionBar">\n        <item name="colorPrimary">@color/colorPrimary</item>\n        <item name="colorPrimaryDark">@android:color/white</item>\n        <item name="colorAccent">@color/colorAccent</item>\n        <item name="android:statusBarColor">@android:color/white</item>\n        <item name="android:windowLightStatusBar">true</item>\n        <item name="android:navigationBarColor">@android:color/white</item>\n        <item name="android:windowBackground">@android:color/white</item>\n    </style>\n    <style name="Theme.JebliApp.Starting" parent="Theme.SplashScreen">\n        <item name="windowSplashScreenBackground">@android:color/white</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon_inset</item>\n        <item name="postSplashScreenTheme">@style/Theme.JebliApp</item>\n    </style>\n</resources>\n' > app/src/main/res/values/styles.xml
          sed -i 's/Theme.JebliApp/Theme.JebliApp.Starting/' app/src/main/AndroidManifest.xml
          sed -i "s/appcompat:1.6.1'/appcompat:1.6.1'\n    implementation 'androidx.core:core-splashscreen:1.0.1'/" app/build.gradle
          sed -i 's/import android.os.Bundle;/import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;/' app/src/main/java/app/netlify/jeblidelivery/twa/MainActivity.java
          sed -i 's/import androidx.appcompat.app.AppCompatActivity;/import androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.splashscreen.SplashScreen;/' app/src/main/java/app/netlify/jeblidelivery/twa/MainActivity.java
          sed -i 's/private FrameLayout splashOverlay;/private volatile boolean pageReady = false;\n    private final Handler uiHandler = new Handler(Looper.getMainLooper());/' app/src/main/java/app/netlify/jeblidelivery/twa/MainActivity.java
          sed -i 's/super.onCreate(savedInstanceState);/SplashScreen splashScreen = SplashScreen.installSplashScreen(this);\n        splashScreen.setKeepOnScreenCondition(() -> !pageReady);\n        super.onCreate(savedInstanceState);\n        uiHandler.postDelayed(() -> pageReady = true, 3000);/' app/src/main/java/app/netlify/jeblidelivery/twa/MainActivity.java
          sed -i '/splashOverlay = buildSplashOverlay/,+4d' app/src/main/java/app/netlify/jeblidelivery/twa/MainActivity.java
          sed -i '/if (splashOverlay != null/,+4c\                checkReactMounted(view, 0);' app/src/main/java/app/netlify/jeblidelivery/twa/MainActivity.java
          sed -i 's/private FrameLayout buildSplashOverlay()/private void checkReactMounted(WebView view, int attempt) {\n        if (pageReady) return;\n        view.evaluateJavascript("(function(){var r=document.getElementById(\x27root\x27);if(!r)return false;return r.children.length>0 \&\& r.innerHTML.indexOf(\x27letter-spacing:-0.02em\x27)===-1;})()", value -> {\n            if ("true".equals(value) || attempt >= 15) { pageReady = true; } else { uiHandler.postDelayed(() -> checkReactMounted(view, attempt + 1), 120); }\n        });\n    }\n    private FrameLayout buildSplashOverlay()/' app/src/main/java/app/netlify/jeblidelivery/twa/MainActivity.java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Jebli-Delivery-Native.apk
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-${{ github.run_number }}
          name: Jebli Delivery Native APK
          make_latest: true
          files: Jebli-Delivery-Native.apk
