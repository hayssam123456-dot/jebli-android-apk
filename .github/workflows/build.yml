name: Build Jebli APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Native Android Project
        run: |
          curl -sSL "https://jeblidelivery.netlify.app/downloads/jebli-android-project.zip" -o project.zip
          unzip -oq project.zip
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jebli-Delivery-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
